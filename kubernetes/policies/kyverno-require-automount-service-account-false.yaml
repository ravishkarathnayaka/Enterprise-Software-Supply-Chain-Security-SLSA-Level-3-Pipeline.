apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-automount-service-account-false
  annotations:
    policies.kyverno.io/title: Require automountServiceAccountToken False
    policies.kyverno.io/category: Least Privilege & RBAC
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Workloads that do not interact with the Kubernetes API must disable automountServiceAccountToken.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-automount-token
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - enterprise-sec-pipeline
      validate:
        message: "automountServiceAccountToken should be explicitly set to false."
        pattern:
          spec:
            automountServiceAccountToken: false

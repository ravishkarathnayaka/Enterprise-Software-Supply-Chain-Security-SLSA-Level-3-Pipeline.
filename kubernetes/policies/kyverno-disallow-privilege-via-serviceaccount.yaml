apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-via-serviceaccount
  annotations:
    policies.kyverno.io/title: Disallow Cluster-Admin RoleBindings
    policies.kyverno.io/category: RBAC Hardening
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Disallow creating RoleBinding or ClusterRoleBinding referencing cluster-admin for app service accounts.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: prevent-cluster-admin-binding
      match:
        any:
          - resources:
              kinds:
                - RoleBinding
                - ClusterRoleBinding
      validate:
        message: "Binding to cluster-admin is strictly forbidden for application workloads."
        pattern:
          roleRef:
            name: "!cluster-admin"

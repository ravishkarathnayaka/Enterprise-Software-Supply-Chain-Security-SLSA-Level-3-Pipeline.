apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auto-generate-namespace-quota
  annotations:
    policies.kyverno.io/title: Auto-Generate Namespace ResourceQuota
    policies.kyverno.io/category: Multi-Tenancy & Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Automatically provisions a default ResourceQuota whenever a new namespace is initialized.
spec:
  rules:
    - name: generate-quota
      match:
        any:
          - resources:
              kinds:
                - Namespace
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: default-tenant-quota
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "8"
              limits.memory: 16Gi
              pods: "20"

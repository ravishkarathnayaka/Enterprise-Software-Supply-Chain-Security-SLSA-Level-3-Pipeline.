apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-default-namespace
  annotations:
    policies.kyverno.io/title: Disallow Workloads in Default Namespace
    policies.kyverno.io/category: Multi-Tenancy & Isolation
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Deploying workloads to the 'default' namespace is prohibited. Workloads must use dedicated tenant namespaces.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: block-default-namespace
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
              namespaces:
                - default
      validate:
        message: "Deployments in the 'default' namespace are prohibited. Target a dedicated namespace."
        deny: {}

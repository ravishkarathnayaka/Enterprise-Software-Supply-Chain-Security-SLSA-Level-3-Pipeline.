apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auto-label-ns-pss
  annotations:
    policies.kyverno.io/title: Auto-Label Namespaces for PSS Restricted
    policies.kyverno.io/category: Governance & Automation
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Mutates new application namespaces to enforce pod-security.kubernetes.io/enforce=restricted.
spec:
  rules:
    - name: add-pss-labels
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - "enterprise-*"
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/enforce-version: latest
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted

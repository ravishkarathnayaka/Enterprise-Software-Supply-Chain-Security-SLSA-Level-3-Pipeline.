apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-empty-ingress-tls
  annotations:
    policies.kyverno.io/title: Disallow Ingress Without TLS
    policies.kyverno.io/category: Network Security & TLS Enforcement
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Ensures all Ingress definitions configure TLS secrets and termination.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-ingress-tls
      match:
        any:
          - resources:
              kinds:
                - Ingress
      validate:
        message: "Ingress resources must configure a valid TLS secret."
        pattern:
          spec:
            tls:
              - secretName: "?*"
                hosts:
                  - "?*"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-unsafe-sysctls
  annotations:
    policies.kyverno.io/title: Disallow Unsafe Kernel Sysctls
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Prohibits modifying kernel parameters via unsafe sysctl attributes.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-sysctls
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Unsafe sysctls are forbidden."
        pattern:
          spec:
            =(securityContext):
              =(sysctls): []

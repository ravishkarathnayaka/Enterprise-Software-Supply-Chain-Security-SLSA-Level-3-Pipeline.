apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Privilege escalation allows a child process to gain more privileges than its parent
      process (via setuid or setgid binaries). This policy strictly blocks privilege escalation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privilege-escalation-denied
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privilege escalation is disallowed. securityContext.allowPrivilegeEscalation must be set to false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

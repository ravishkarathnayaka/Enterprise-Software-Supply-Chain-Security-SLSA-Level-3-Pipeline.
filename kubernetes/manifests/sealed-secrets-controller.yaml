apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealed-secrets
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: controller
          image: bitnami/sealed-secrets-controller:v0.26.0@sha256:f123456789abcdef123456789abcdef123456789abcdef123456789abcdef1234
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

apiVersion: audit.k8s.io/v1
kind: Policy
metadata:
  name: supply-chain-audit-policy
rules:
  - level: RequestResponse
    verbs: ["create", "update", "patch"]
    resources:
      - group: ""
        resources: ["pods"]
      - group: "kyverno.io"
        resources: ["clusterpolicies", "policies"]
  - level: Metadata
    resources:
      - group: ""
        resources: ["configmaps", "secrets"]

apiVersion: kyverno.io/v2alpha1
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-stale-ephemeral-test-pods
  annotations:
    policies.kyverno.io/title: Cleanup Stale Ephemeral Test Pods
    policies.kyverno.io/description: Automatically prune transient diagnostic pods older than 2 hours.
spec:
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - enterprise-sec-pipeline
          selector:
            matchLabels:
              purpose: transient-security-probe
  schedule: "0 */2 * * *"
  conditions:
    all:
      - key: "{{ time_since('', '{{ target.metadata.creationTimestamp }}', '') }}"
        operator: GreaterThan
        value: 2h

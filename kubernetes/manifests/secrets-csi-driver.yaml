apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kms-cosign-secrets
  namespace: secure-supply-chain
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.internal:8200"
    roleName: "supply-chain-signer"
    objects: |
      - objectName: "cosign-verification-pubkey"
        secretPath: "secret/data/cosign/public"
        secretKey: "key"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-supply-chain-app
  namespace: secure-supply-chain
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - enterprise-supply-chain-app
                topologyKey: "kubernetes.io/hostname"

apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredImageSignatures
metadata:
  name: require-slsa-level-3-attestation
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "secure-supply-chain"
  parameters:
    trustedRootCA: "sigstore-fulcio"
    minimumSlsaLevel: 3

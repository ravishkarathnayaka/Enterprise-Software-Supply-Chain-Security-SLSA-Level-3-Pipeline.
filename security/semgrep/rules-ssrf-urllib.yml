rules:
  - id: unvalidated-urllib-request
    patterns:
      - pattern: urllib.request.urlopen($URL, ...)
      - pattern-not: urllib.request.urlopen("...", ...)
    message: "Passing dynamic or unvalidated URLs to urllib.request.urlopen triggers Server-Side Request Forgery (SSRF)."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      category: security
      technology: [python]

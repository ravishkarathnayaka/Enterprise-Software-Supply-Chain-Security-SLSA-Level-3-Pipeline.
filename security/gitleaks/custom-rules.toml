# Custom Gitleaks Signatures for Enterprise Supply Chain Artifacts

[[rules]]
id = "cosign-private-key-password"
description = "Detected potential Cosign private key password assignment"
regex = '''(?i)(COSIGN_PASSWORD|SIGSTORE_PASSWORD)\s*[:=]\s*["']?[A-Za-z0-9_!@#$%^&*()]{8,}["']?'''
keywords = ["COSIGN_PASSWORD", "SIGSTORE_PASSWORD"]

[[rules]]
id = "github-actions-id-token"
description = "Detected leaked GitHub Actions JWT / OIDC ID token"
regex = '''ey[A-Za-z0-9-_=]+\.ey[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'''
keywords = ["ey"]

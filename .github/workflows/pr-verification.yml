# ==============================================================================
# Pull Request Fast Verification Pipeline
# Rapid pre-merge security & code quality validation
# ==============================================================================
name: PR Security & Quality Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ============================================================================
  # Quality & Test Gate
  # ============================================================================
  test-and-lint:
    name: "Python Lint & Pytest Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd app
          pytest tests/ -v

  # ============================================================================
  # Secret Scanning Gate
  # ============================================================================
  secret-scan:
    name: "Gitleaks PR Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks/.gitleaks.toml

  # ============================================================================
  # SAST Gate
  # ============================================================================
  sast-check:
    name: "Semgrep SAST Rules Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scans
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "security/semgrep/rules.yml" \
            --error

  # ============================================================================
  # Dependency Vulnerability Gate
  # ============================================================================
  dependency-scan:
    name: "Trivy Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Scan Filesystem for Vulnerable Dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

# ==============================================================================
# Dependabot Configuration: Automated Vulnerability Patching & Dependency Updates
# ==============================================================================
version: 2
updates:
  # Python Dependencies
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "chore(deps-python)"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci-cd"
    commit-message:
      prefix: "chore(deps-actions)"

  # Dockerfile Base Images
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "container"
      - "security"
    commit-message:
      prefix: "chore(deps-docker)"
